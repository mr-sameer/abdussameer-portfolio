<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background gradient: Paper to slightly warmer -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F1E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EBE7DF;stop-opacity:1" />
    </linearGradient>
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0A1120" stroke-width="0.3" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Vermilion accent bar left -->
  <rect x="0" y="0" width="8" height="630" fill="#FF5D37"/>

  <!-- Semiconductor lattice motif (top-right decorative) -->
  <g transform="translate(820, 80)" opacity="0.12">
    <!-- Wafer circle -->
    <circle cx="200" cy="200" r="180" fill="none" stroke="#0A1120" stroke-width="1.5"/>
    <!-- Inner reticle grid lines -->
    <line x1="20" y1="200" x2="380" y2="200" stroke="#0A1120" stroke-width="0.8"/>
    <line x1="200" y1="20" x2="200" y2="380" stroke="#0A1120" stroke-width="0.8"/>
    <line x1="80" y1="80" x2="320" y2="320" stroke="#0A1120" stroke-width="0.4"/>
    <line x1="320" y1="80" x2="80" y2="320" stroke="#0A1120" stroke-width="0.4"/>
    <!-- Reticle squares -->
    <rect x="120" y="120" width="160" height="160" fill="none" stroke="#0A1120" stroke-width="1"/>
    <rect x="150" y="150" width="100" height="100" fill="none" stroke="#FF5D37" stroke-width="0.8"/>
    <rect x="175" y="175" width="50" height="50" fill="#0A1120" fill-opacity="0.15"/>
    <!-- Crosshair marks -->
    <circle cx="200" cy="200" r="4" fill="#FF5D37"/>
    <circle cx="120" cy="120" r="2.5" fill="#0A1120" fill-opacity="0.5"/>
    <circle cx="280" cy="120" r="2.5" fill="#0A1120" fill-opacity="0.5"/>
    <circle cx="120" cy="280" r="2.5" fill="#0A1120" fill-opacity="0.5"/>
    <circle cx="280" cy="280" r="2.5" fill="#0A1120" fill-opacity="0.5"/>
  </g>

  <!-- Eyebrow label -->
  <text x="72" y="192" font-family="'DM Mono', 'Courier New', monospace" font-size="16" font-weight="600"
        fill="#596575" letter-spacing="4" text-transform="uppercase">
    INTERDISCIPLINARY THINKER · RESEARCHER · BUILDER
  </text>

  <!-- Main headline -->
  <text x="72" y="290" font-family="'Playfair Display', Georgia, serif" font-size="72" font-weight="700"
        fill="#0A1120" letter-spacing="-2">
    Abdus Sameer
  </text>

  <!-- Tagline line 1 -->
  <text x="72" y="380" font-family="'Playfair Display', Georgia, serif" font-size="40" font-weight="400"
        fill="#0A1120" letter-spacing="-0.5">
    Connecting ideas.
  </text>

  <!-- Tagline line 2 — vermilion accent -->
  <text x="72" y="435" font-family="'Playfair Display', Georgia, serif" font-size="40" font-weight="600"
        fill="#FF5D37" letter-spacing="-0.5">
    Solving problems.
  </text>

  <!-- Domain / URL -->
  <text x="72" y="560" font-family="'DM Mono', 'Courier New', monospace" font-size="18" font-weight="400"
        fill="#596575" letter-spacing="1">
    abdussameer.com
  </text>

  <!-- Bottom border line -->
  <line x1="72" y1="590" x2="1128" y2="590" stroke="#0A1120" stroke-width="1" stroke-opacity="0.15"/>
</svg>
