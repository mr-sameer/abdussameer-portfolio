<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F1E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EBE7DF;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0A1120" stroke-width="0.3" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="0" y="0" width="8" height="630" fill="#FF5D37"/>

  <!-- Eyebrow -->
  <text x="72" y="192" font-family="'DM Mono', 'Courier New', monospace" font-size="16" font-weight="600"
        fill="#596575" letter-spacing="4">
    PERSONAL NARRATIVE &amp; INTELLECTUAL JOURNEY
  </text>

  <!-- Main headline -->
  <text x="72" y="290" font-family="'Playfair Display', Georgia, serif" font-size="72" font-weight="700"
        fill="#0A1120" letter-spacing="-2">
    About Abdus Sameer
  </text>

  <!-- Sub lines -->
  <text x="72" y="380" font-family="'Playfair Display', Georgia, serif" font-size="36" font-weight="400"
        fill="#0A1120" letter-spacing="-0.5">
    Education · Experience · Philosophy
  </text>

  <text x="72" y="445" font-family="'DM Sans', Arial, sans-serif" font-size="22" font-weight="400"
        fill="#596575">
    BCA · MCA · MA Economics · Sales &amp; Business Development
  </text>

  <!-- Domain -->
  <text x="72" y="560" font-family="'DM Mono', 'Courier New', monospace" font-size="18" font-weight="400"
        fill="#596575" letter-spacing="1">
    abdussameer.com/about
  </text>

  <line x1="72" y1="590" x2="1128" y2="590" stroke="#0A1120" stroke-width="1" stroke-opacity="0.15"/>
</svg>
